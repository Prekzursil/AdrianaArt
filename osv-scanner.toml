# osv-scanner configuration for the lean dependency gate (pinned tool: osv-scanner 2.3.8).
# The gate runs `osv-scanner scan source --config=osv-scanner.toml --recursive .`
# (per the reusable-quality.yml gate-deps step) over the repo's lockfiles
# (backend Python + frontend npm) and must report 0 actionable CVEs.
#
# POLICY: ignore entries are allowed ONLY for a genuinely-unfixable vuln (no
# non-breaking upgrade) OR one that is provably not reachable in THIS product,
# each with a reason + dated review note (greppable). We do NOT use a baseline
# file — clean-zero is reached by upgrading where a safe fix exists, and only by
# a reasoned per-CVE ignore where it does not (Dependabot drives the upgrades).
#
# Lockfiles in this monorepo:
#   - backend/requirements.txt          (pinned Python deps)
#   - backend/requirements-ci.txt       (pinned Python CI deps)
#   - frontend/package-lock.json        (Angular/TypeScript npm tree)
#
# NOTE: because the gate passes `--config=osv-scanner.toml` explicitly, this ONE
# root file governs every lockfile scanned by `--recursive .`, including
# frontend/package-lock.json. It is not per-directory here.
#
# SCHEMA WARNING: inside [[IgnoredVulns]] only `id`, `ignoreUntil` and `reason`
# are valid keys. osv-scanner REJECTS THE ENTIRE FILE on any unknown key and then
# silently falls back to an EMPTY config (internal/config/config.go,
# tryLoadConfig -> "unknown keys in config file"), so a typo'd or invented field
# disables the ignore with no error. Extra context therefore lives in comments
# like these, never in extra keys. `ignoreUntil` is a bare TOML date, not a
# quoted string.
#
# ── ENTRY 1/2: GHSA-5p2g-fcmc-qvqq + GHSA-w3rx-r6r6-pgpr (image-size DoS) ───
# WHY IT EXISTS:
#   * Advisories cover infinite-loop DoS in JXL/HEIF and ICNS parsers.
#   * DEV + OPTIONAL ONLY. Lock row is image-size 0.5.5 under less (~0.5.0
#     optionalDependencies); osv-scanner labels it (dev).
#   * NO FIX EXISTS upstream. Both advisories list last_affected: 2.0.2, and
#     2.0.2 is the newest published release on npm — there is no patched version
#     to override to. Forcing a bump cannot clear the gate.
#   * Not reachable in production: less's optional image-size is a build/CSS
#     toolchain helper, not shipped to browsers or SSR request paths.
#
# RE-CHECK ON EXPIRY: has image-size published >2.0.2 with a fix range, or has
# less dropped the optional image-size@~0.5.0 dependency? If either is true,
# DELETE these entries rather than extending the date.

[[IgnoredVulns]]
id = "GHSA-5p2g-fcmc-qvqq"
ignoreUntil = 2026-12-05
reason = "image-size JXL/HEIF infinite-loop DoS, unfixable: advisories list last_affected 2.0.2 and 2.0.2 is the newest npm release (no fixed version). Lock row is optional/dev-only via less (~0.5.0 optionalDependencies); not on production request paths. Time-boxed to 2026-12-05; re-check for a patched release or less dropping the optional dep."

[[IgnoredVulns]]
id = "GHSA-w3rx-r6r6-pgpr"
ignoreUntil = 2026-12-05
reason = "image-size ICNS infinite-loop DoS, unfixable: advisories list last_affected 2.0.2 and 2.0.2 is the newest npm release (no fixed version). Lock row is optional/dev-only via less (~0.5.0 optionalDependencies); not on production request paths. Time-boxed to 2026-12-05; re-check for a patched release or less dropping the optional dep."
