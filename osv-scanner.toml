# osv-scanner configuration for the lean dependency gate (pinned tool: osv-scanner 2.3.8).
# The gate runs `osv-scanner scan source --config=osv-scanner.toml --recursive .`
# (per the reusable-quality.yml gate-deps step) over the repo's lockfiles
# (backend Python + frontend npm) and must report 0 actionable CVEs.
#
# POLICY: ignore entries are allowed ONLY for a genuinely-unfixable vuln (no
# non-breaking upgrade) OR one that is provably not reachable in THIS product,
# each with a reason + dated review note (greppable). We do NOT use a baseline
# file — clean-zero is reached by upgrading where a safe fix exists, and only by
# a reasoned per-CVE ignore where it does not (Dependabot drives the upgrades).
#
# Lockfiles in this monorepo:
#   - backend/requirements.txt          (pinned Python deps)
#   - backend/requirements-ci.txt       (pinned Python CI deps)
#   - frontend/package-lock.json        (Angular/TypeScript npm tree)
#
# NOTE: because the gate passes `--config=osv-scanner.toml` explicitly, this ONE
# root file governs every lockfile scanned by `--recursive .`, including
# frontend/package-lock.json. It is not per-directory here.
#
# SCHEMA WARNING: inside [[IgnoredVulns]] only `id`, `ignoreUntil` and `reason`
# are valid keys. osv-scanner REJECTS THE ENTIRE FILE on any unknown key and then
# silently falls back to an EMPTY config (internal/config/config.go,
# tryLoadConfig -> "unknown keys in config file"), so a typo'd or invented field
# disables the ignore with no error. Extra context therefore lives in comments
# like these, never in extra keys. `ignoreUntil` is a bare TOML date, not a
# quoted string.
#
# ── ENTRY 1: GHSA-5p2g-fcmc-qvqq + GHSA-w3rx-r6r6-pgpr (image-size DoS) ──────
# WHY IT EXISTS, in full:
#   * Both advisories cover image-size through 2.0.2 (infinite loop on crafted
#     JXL/HEIF/ICNS buffers). osv-scanner reports FIXED VERSION as "--".
#   * The claimed 2.0.3 patch is NOT on npm (latest published is 2.0.2;
#     github/advisory-database#9028). There is no 0.5.x backport.
#   * THIS COPY is image-size 0.5.5, an OPTIONAL dependency of less@4.4.2
#     (less-loader via @angular-devkit/build-angular). Dev-toolchain only.
#     Storefront image handling does not call less/image-size on user uploads.
#   * Forcing image-size@2 onto less@4.4.2 is an untested major across a
#     package that still requests ~0.5.0. less 4.4.2 is the latest 4.x
#     Angular 21 pins; jumping less 5 is out of scope for this gate fix.
#   * GHSA-mh99-v99m-4gvg (brace-expansion) is no longer present after
#     pinning brace-expansion 1.1.18 / 2.1.4 / 5.0.9 — do not re-add it.
#
# RE-CHECK ON EXPIRY: has less dropped image-size ~0.5, or has image-size
# published a real 0.5.x/2.0.3+ fix? If yes, DELETE these two entries.

[[IgnoredVulns]]
id = "GHSA-5p2g-fcmc-qvqq"
ignoreUntil = 2026-11-19
reason = "image-size 0.5.5 (dev, optional dep of less@4.4.2 via @angular-devkit/build-angular less-loader). Advisory has no published fix (FIXED VERSION --; claimed 2.0.3 is unpublished, latest npm is 2.0.2). Not reachable from storefront upload paths. Time-boxed; re-check less and image-size releases."

[[IgnoredVulns]]
id = "GHSA-w3rx-r6r6-pgpr"
ignoreUntil = 2026-11-19
reason = "Same image-size 0.5.5 optional less@4.4.2 copy as GHSA-5p2g-fcmc-qvqq. No published fix. Dev-only, not used on untrusted image bytes. Time-boxed to 2026-11-19."

# RETIRED 2026-08-19: GHSA-mh99-v99m-4gvg. Cleared by brace-expansion
# 1.1.18 / 2.1.4 / 5.0.9. Do not re-add unless those pins regress.
